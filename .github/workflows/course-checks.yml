name: Check course calculations

on:
  push:
    branches: [main]
    paths: ['*.py', 'requirements*.txt', 'notebooks/**', 'scripts/**', 'tests/**', '.github/workflows/course-checks.yml']
  pull_request:
    paths: ['*.py', 'requirements*.txt', 'notebooks/**', 'scripts/**', 'tests/**', '.github/workflows/course-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-training.txt
          python -m ipykernel install --user --name python3
      - name: Run numerical and publishing checks
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
      - name: Execute both languages of the learning block
        run: python scripts/build_lessons.py --lessons 6 7 8 9
